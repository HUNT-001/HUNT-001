<svg width="1400" height="440" viewBox="0 0 1400 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#030811"/>
      <stop offset="40%"  stop-color="#071226"/>
      <stop offset="75%"  stop-color="#0C1D3E"/>
      <stop offset="100%" stop-color="#0E2B50"/>
    </linearGradient>

    <radialGradient id="glowL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(200 180) scale(500 280)">
      <stop offset="0%"   stop-color="#1D4ED8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1200 160) scale(520 280)">
      <stop offset="0%"   stop-color="#06B6D4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#60A5FA" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#E0F2FE" stop-opacity="0.85"/>
      <stop offset="78%"  stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="faceFill" x1="0" y1="108" x2="0" y2="265" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="25%"  stop-color="#EEF6FF"/>
      <stop offset="55%"  stop-color="#C9E0FF"/>
      <stop offset="85%"  stop-color="#9DC4F5"/>
      <stop offset="100%" stop-color="#72A8E8"/>
    </linearGradient>
    <linearGradient id="shineFill" x1="0" y1="108" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="45%"  stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="depthFill" x1="0" y1="180" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#14213A"/>
      <stop offset="50%"  stop-color="#08101E"/>
      <stop offset="100%" stop-color="#01030A"/>
    </linearGradient>

    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.8" fill="#4A90D9" fill-opacity="0.12"/>
    </pattern>

    <filter id="floorShadow" x="-40%" y="-40%" width="220%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
    <filter id="heroGlow" x="-20%" y="-30%" width="160%" height="200%">
      <feDropShadow dx="0" dy="4"  stdDeviation="2"  flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="0"  stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.10"/>
    </filter>
    <filter id="tagGlow" x="-10%" y="-20%" width="130%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38BDF8" flood-opacity="0.25"/>
    </filter>
    <filter id="cornerGlow" x="-50%" y="-50%" width="250%" height="250%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#60A5FA" flood-opacity="0.45"/>
    </filter>
    <filter id="dotGlow" x="-200%" y="-200%" width="600%" height="600%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
    </filter>

    <clipPath id="bannerClip">
      <rect width="1400" height="440" rx="28"/>
    </clipPath>

  </defs>

  <rect width="1400" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="440" rx="28" fill="url(#glowL)"/>
  <rect width="1400" height="440" rx="28" fill="url(#glowR)"/>

  <g clip-path="url(#bannerClip)">

    <rect width="1400" height="440" fill="url(#dotGrid)" opacity="1"/>

    <!-- Accent lines -->
    <rect x="0" y="54" width="1400" height="1.2" rx="1" fill="url(#lineGrad)" opacity="0.8"/>
    <rect x="0" y="388" width="1400" height="1.2" rx="1" fill="url(#lineGrad)" opacity="0.6"/>

    <path d="M700 51 L704.5 54 L700 57 L695.5 54 Z" fill="#E0F2FE" opacity="0.7"/>
    <path d="M700 385 L704.5 388 L700 391 L695.5 388 Z" fill="#67E8F9" opacity="0.6"/>

    <!-- Corner brackets -->
    <g filter="url(#cornerGlow)" opacity="0.8">
      <path d="M30 30 L30 68 M30 30 L68 30" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="30" cy="30" r="2.5" fill="#60A5FA"/>
    </g>
    <g filter="url(#cornerGlow)" opacity="0.8">
      <path d="M1370 30 L1370 68 M1370 30 L1332 30" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="1370" cy="30" r="2.5" fill="#60A5FA"/>
    </g>
    <g filter="url(#cornerGlow)" opacity="0.8">
      <path d="M30 410 L30 372 M30 410 L68 410" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
      <circle cx="30" cy="410" r="2.5" fill="#22D3EE"/>
    </g>
    <g filter="url(#cornerGlow)" opacity="0.8">
      <path d="M1370 410 L1370 372 M1370 410 L1332 410" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
      <circle cx="1370" cy="410" r="2.5" fill="#22D3EE"/>
    </g>

    <!-- LEFT PANEL -->
    <rect x="44" y="120" width="168" height="196" rx="5"
          fill="#060F22" fill-opacity="0.45" stroke="#1A3D7A" stroke-width="0.8"/>
    <rect x="44" y="120" width="168" height="3" rx="1.5" fill="#3B82F6" opacity="0.5"/>
    <text x="58" y="142" fill="#4D88C4" font-size="8.5" font-family="Consolas, monospace" letter-spacing="2" opacity="0.8">SYS · STATUS</text>
    <line x1="58" y1="148" x2="198" y2="148" stroke="#1A3D7A" stroke-width="0.7" opacity="0.7"/>
    <text x="58" y="165" fill="#5BA3D0" font-size="8" font-family="Consolas, monospace" letter-spacing="1" opacity="0.65">ARCH  ▸  VLSI · RTL</text>
    <text x="58" y="181" fill="#5BA3D0" font-size="8" font-family="Consolas, monospace" letter-spacing="1" opacity="0.65">AI    ▸  EDGE · ML</text>
    <text x="58" y="197" fill="#5BA3D0" font-size="8" font-family="Consolas, monospace" letter-spacing="1" opacity="0.65">SIM   ▸  VERIF</text>
    <text x="58" y="213" fill="#5BA3D0" font-size="8" font-family="Consolas, monospace" letter-spacing="1" opacity="0.65">HW    ▸  FPGA</text>
    <line x1="58" y1="221" x2="198" y2="221" stroke="#1A3D7A" stroke-width="0.7" opacity="0.7"/>
    <text x="58" y="237" fill="#3A618E" font-size="7.5" font-family="Consolas, monospace" letter-spacing="1.5" opacity="0.65">BUILD  ▸  2025.REV.04</text>
    <polyline points="58,288 78,276 98,282 118,268 138,273 158,262 178,270 198,258"
              fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="58,295 78,290 98,294 118,285 138,289 158,280 178,284 198,275"
              fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.28" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="44" y="313" width="168" height="3" rx="1.5" fill="#0EA5E9" opacity="0.4"/>

    <!-- RIGHT PANEL -->
    <rect x="1188" y="120" width="168" height="196" rx="5"
          fill="#060F22" fill-opacity="0.45" stroke="#1A3D7A" stroke-width="0.8"/>
    <rect x="1188" y="120" width="168" height="3" rx="1.5" fill="#22D3EE" opacity="0.45"/>
    <text x="1202" y="142" fill="#4DB8CC" font-size="8.5" font-family="Consolas, monospace" letter-spacing="2" opacity="0.8">DEV · STACK</text>
    <line x1="1202" y1="148" x2="1342" y2="148" stroke="#1A3D7A" stroke-width="0.7" opacity="0.7"/>
    <text x="1202" y="165" fill="#5BA3D0" font-size="8" font-family="Consolas, monospace" letter-spacing="1" opacity="0.65">◆  SystemVerilog</text>
    <text x="1202" y="181" fill="#5BA3D0" font-size="8" font-family="Consolas, monospace" letter-spacing="1" opacity="0.65">◆  Python · C++</text>
    <text x="1202" y="197" fill="#5BA3D0" font-size="8" font-family="Consolas, monospace" letter-spacing="1" opacity="0.65">◆  TensorFlow</text>
    <text x="1202" y="213" fill="#5BA3D0" font-size="8" font-family="Consolas, monospace" letter-spacing="1" opacity="0.65">◆  Cadence EDA</text>
    <line x1="1202" y1="221" x2="1342" y2="221" stroke="#1A3D7A" stroke-width="0.7" opacity="0.7"/>
    <circle cx="1228" cy="270" r="20" fill="none" stroke="#0F2040" stroke-width="4" opacity="0.8"/>
    <circle cx="1228" cy="270" r="20" fill="none" stroke="#3B82F6" stroke-width="4"
            stroke-dasharray="100 126" stroke-dashoffset="32" opacity="0.5" stroke-linecap="round"/>
    <text x="1228" y="274" text-anchor="middle" fill="#5BA3D0" font-size="8" font-family="Consolas, monospace" opacity="0.75">HW</text>
    <circle cx="1272" cy="270" r="20" fill="none" stroke="#0F2040" stroke-width="4" opacity="0.8"/>
    <circle cx="1272" cy="270" r="20" fill="none" stroke="#22D3EE" stroke-width="4"
            stroke-dasharray="90 126" stroke-dashoffset="32" opacity="0.45" stroke-linecap="round"/>
    <text x="1272" y="274" text-anchor="middle" fill="#4DB8CC" font-size="8" font-family="Consolas, monospace" opacity="0.75">AI</text>
    <circle cx="1316" cy="270" r="20" fill="none" stroke="#0F2040" stroke-width="4" opacity="0.8"/>
    <circle cx="1316" cy="270" r="20" fill="none" stroke="#818CF8" stroke-width="4"
            stroke-dasharray="80 126" stroke-dashoffset="32" opacity="0.4" stroke-linecap="round"/>
    <text x="1316" y="274" text-anchor="middle" fill="#A5B4FC" font-size="7.5" font-family="Consolas, monospace" opacity="0.75">SIM</text>
    <rect x="1188" y="313" width="168" height="3" rx="1.5" fill="#3B82F6" opacity="0.4"/>

    <!-- Particle nodes -->
    <circle cx="110"  cy="76"  r="4"   fill="#38BDF8" opacity="0.3" filter="url(#dotGlow)"/>
    <circle cx="110"  cy="76"  r="2"   fill="#BAE6FD" opacity="0.75"/>
    <circle cx="1290" cy="76"  r="4"   fill="#38BDF8" opacity="0.3" filter="url(#dotGlow)"/>
    <circle cx="1290" cy="76"  r="2"   fill="#BAE6FD" opacity="0.75"/>
    <circle cx="340"  cy="402" r="3.5" fill="#22D3EE" opacity="0.28" filter="url(#dotGlow)"/>
    <circle cx="340"  cy="402" r="1.6" fill="#A5F3FC" opacity="0.7"/>
    <circle cx="1060" cy="402" r="3.5" fill="#22D3EE" opacity="0.28" filter="url(#dotGlow)"/>
    <circle cx="1060" cy="402" r="1.6" fill="#A5F3FC" opacity="0.7"/>

    <!-- Top label -->
    <text x="618" y="95" fill="#3B6EA8" font-size="22" font-family="Consolas, monospace" opacity="0.5">&#8249;</text>
    <text x="778" y="95" fill="#3B6EA8" font-size="22" font-family="Consolas, monospace" opacity="0.5">&#8250;</text>
    <text x="700" y="96"
          text-anchor="middle"
          fill="#C8E0F8"
          font-size="28"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-weight="600"
          letter-spacing="9"
          opacity="0.9">
      HI,  I'M
    </text>

    <!-- Ground shadow -->
    <ellipse cx="700" cy="300" rx="370" ry="46" fill="#000000" opacity="0.38" filter="url(#floorShadow)"/>

    <!-- Extrusion (3 layers) -->
    <text x="712" y="252" text-anchor="middle" fill="#050D1A"
          font-size="178" font-family="'Arial Black', Impact, sans-serif" font-weight="900" letter-spacing="4">TANUSH</text>
    <text x="706" y="246" text-anchor="middle" fill="#0A1828"
          font-size="178" font-family="'Arial Black', Impact, sans-serif" font-weight="900" letter-spacing="4">TANUSH</text>
    <text x="700" y="240" text-anchor="middle" fill="url(#depthFill)"
          font-size="178" font-family="'Arial Black', Impact, sans-serif" font-weight="900" letter-spacing="4">TANUSH</text>

    <!-- Main face -->
    <text x="690" y="228"
          text-anchor="middle"
          fill="url(#faceFill)"
          stroke="#030711"
          stroke-width="6"
          paint-order="stroke"
          font-size="178"
          font-family="'Arial Black', Impact, sans-serif"
          font-weight="900"
          letter-spacing="4"
          filter="url(#heroGlow)">
      TANUSH
    </text>

    <!-- Shine -->
    <text x="690" y="228"
          text-anchor="middle"
          fill="url(#shineFill)"
          font-size="178"
          font-family="'Arial Black', Impact, sans-serif"
          font-weight="900"
          letter-spacing="4"
          opacity="0.88">
      TANUSH
    </text>

    <!-- Subtle rim -->
    <text x="690" y="228"
          text-anchor="middle"
          fill="none"
          stroke="#A5F3FC"
          stroke-width="1"
          opacity="0.14"
          font-size="178"
          font-family="'Arial Black', Impact, sans-serif"
          font-weight="900"
          letter-spacing="4">
      TANUSH
    </text>

    <!-- Identity strip -->
    <rect x="290" y="350" width="820" height="32" rx="6"
          fill="#040C1C" fill-opacity="0.6" stroke="#162F5C" stroke-width="0.8"/>
    <rect x="290" y="350" width="3" height="32" rx="1.5" fill="#3B82F6" opacity="0.65"/>
    <rect x="1107" y="350" width="3" height="32" rx="1.5" fill="#22D3EE" opacity="0.65"/>
    <text x="700" y="372"
          text-anchor="middle"
          fill="#5FA8CC"
          font-size="12"
          font-family="'Consolas', 'Monaco', monospace"
          font-weight="600"
          letter-spacing="3.5"
          filter="url(#tagGlow)">
