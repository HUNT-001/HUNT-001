    </text>

    <!-- Bottom meta -->
    <text x="700" y="416"
          text-anchor="middle"
          fill="#1E3F72"
          font-size="9.5"
          font-family="Consolas, monospace"
          letter-spacing="3.5"
          opacity="0.5">
      ── github.com/tanush ──
    </text>

    <!-- Outer border -->
    <rect x="1" y="1" width="1398" height="438" rx="27.5"
          fill="none" stroke="#162F5C" stroke-width="1.2" opacity="0.6"/>

