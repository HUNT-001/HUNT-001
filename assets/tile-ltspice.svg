<svg width="76" height="76" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="76" height="76" rx="16" fill="#200008"/>
  <rect x="1" y="1" width="74" height="74" rx="15" stroke="#991B1B" stroke-width="2"/>
  <!-- oscilloscope frame -->
  <rect x="13" y="14" width="50" height="38" rx="3.5" fill="#F87171" fill-opacity="0.08" stroke="#F87171" stroke-width="2.2"/>
  <!-- horizontal axis -->
  <line x1="18" y1="33" x2="58" y2="33" stroke="#F87171" stroke-width="1.4" opacity="0.45"/>
  <!-- vertical axis -->
  <line x1="20" y1="16" x2="20" y2="50" stroke="#F87171" stroke-width="1.4" opacity="0.45"/>
  <!-- sine wave output -->
  <path d="M20 33 Q25 19 30 33 Q35 47 40 33 Q45 19 50 33 Q55 47 58 33"
        stroke="#F87171" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- resistor symbol (zigzag) below frame as schematic hint -->
  <path d="M24 57 L26 54 L28.5 59 L31 54 L33.5 59 L36 54 L38 57"
        stroke="#F87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.65"/>
  <!-- "V" axis label -->
  <text x="17" y="20" fill="#F87171" font-size="7" font-family="Segoe UI,sans-serif" font-weight="700">V</text>
  <text x="59" y="37" fill="#F87171" font-size="7" font-family="Segoe UI,sans-serif" font-weight="700">t</text>
  <text x="38" y="68" text-anchor="middle" fill="#FEE2E2" font-size="9.5" font-family="Segoe UI, sans-serif" font-weight="700" letter-spacing="0.3">LTspice</text>
</svg>