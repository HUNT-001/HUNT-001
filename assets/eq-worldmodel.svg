<text x="70" y="52" fill="#22D3EE" font-size="11" font-family="Consolas, 'JetBrains Mono', monospace" letter-spacing="4.5" opacity="0.85">RECURRENT STATE-SPACE MODEL &#8212; VARIATIONAL OBJECTIVE</text>
<text x="70" y="118" fill="#EAF4FF" font-size="30" font-family="'Cambria Math', 'Latin Modern Math', Georgia, serif" font-style="italic" filter="url(#soft)">&#8466; = &#120124;<tspan font-size="17" dy="6">q</tspan><tspan dy="-6"> [ &#8721;</tspan><tspan font-size="17" dy="6">t</tspan><tspan dy="-6"> ( ln p(o</tspan><tspan font-size="17" dy="6">t</tspan><tspan dy="-6"> | h</tspan><tspan font-size="17" dy="6">t</tspan><tspan dy="-6">, z</tspan><tspan font-size="17" dy="6">t</tspan><tspan dy="-6">) + ln p(r</tspan><tspan font-size="17" dy="6">t</tspan><tspan dy="-6"> | h</tspan><tspan font-size="17" dy="6">t</tspan><tspan dy="-6">, z</tspan><tspan font-size="17" dy="6">t</tspan><tspan dy="-6">) &#8722; &#946; D</tspan><tspan font-size="17" dy="6">KL</tspan><tspan dy="-6"> ) ]</tspan></text>
<text x="70" y="166" fill="#BCD9F7" font-size="21" font-family="'Cambria Math', 'Latin Modern Math', Georgia, serif" font-style="italic" opacity="0.92">D<tspan font-size="13" dy="5">KL</tspan><tspan dy="-5"> = KL[ q(z</tspan><tspan font-size="13" dy="5">t</tspan><tspan dy="-5"> | h</tspan><tspan font-size="13" dy="5">t</tspan><tspan dy="-5">, o</tspan><tspan font-size="13" dy="5">t</tspan><tspan dy="-5">) &#8214; p(z</tspan><tspan font-size="13" dy="5">t</tspan><tspan dy="-5"> | h</tspan><tspan font-size="13" dy="5">t</tspan><tspan dy="-5">) ]&#160;&#160;&#160;&#160; h</tspan><tspan font-size="13" dy="5">t</tspan><tspan dy="-5"> = f(h</tspan><tspan font-size="13" dy="5">t&#8722;1</tspan><tspan dy="-5">, z</tspan><tspan font-size="13" dy="5">t&#8722;1</tspan><tspan dy="-5">, a</tspan><tspan font-size="13" dy="5">t&#8722;1</tspan><tspan dy="-5">)</tspan></text>
<text x="70" y="206" fill="#7FA6D4" font-size="11.5" font-family="Consolas, 'JetBrains Mono', monospace" opacity="0.82">reconstruct the world, predict the reward, and pay a KL price for every bit of surprise you smuggle into the latent.</text>
<text x="70" y="226" fill="#7FA6D4" font-size="11.5" font-family="Consolas, 'JetBrains Mono', monospace" opacity="0.62">&#946; is the whole argument: too low and the model memorises, too high and it stops dreaming.</text>
