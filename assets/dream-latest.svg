<svg width="1400" height="284" viewBox="0 0 1400 284" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="284" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030811"/><stop offset="50%" stop-color="#071226"/>
      <stop offset="100%" stop-color="#0C1D3E"/>
    </linearGradient>
    <radialGradient id="amb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(420.0 142.0) scale(620 230)">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="0.7" fill="#4A90D9" fill-opacity="0.09"/>
    </pattern>
    <clipPath id="clip"><rect width="1400" height="284" rx="16"/></clipPath>
  </defs>
  <rect width="1400" height="284" rx="16" fill="url(#bg)"/>
  <rect width="1400" height="284" rx="16" fill="url(#amb)"/>
  <g clip-path="url(#clip)">
    <rect width="1400" height="284" fill="url(#dotGrid)"/>
    <rect x="0" y="56" width="1400" height="1" fill="#A78BFA" opacity="0.18"/>
    <rect x="0" y="204" width="1400" height="1" fill="#A78BFA" opacity="0.14"/>
    <text x="46" y="38" fill="#7FA6D4" font-size="10" font-family="Consolas, 'JetBrains Mono', monospace" letter-spacing="2.6" opacity="0.75">// LATENT ROLLOUT &#183; DREAM 0004 &#183; 2026-10-10</text>
    <text x="1354" y="38" text-anchor="end" fill="#7FA6D4" font-size="10" font-family="Consolas, 'JetBrains Mono', monospace" letter-spacing="2.6" opacity="0.6">deterministic</text>
    <text x="46" y="86" fill="#CFE6FF" font-size="16.5" font-family="Consolas, 'JetBrains Mono', monospace" letter-spacing="0.4" opacity="1">22 pushes observed across 4 repositories; dominant thread: world-model.</text>
    <text x="46" y="120" fill="#CFE6FF" font-size="16.5" font-family="Consolas, 'JetBrains Mono', monospace" letter-spacing="0.4" opacity="1">Rolling forward: the dynamics hold for about three steps, then imagination outruns evidence.</text>
    <text x="46" y="154" fill="#7FA6D4" font-size="14" font-family="Consolas, 'JetBrains Mono', monospace" letter-spacing="0.4" opacity="0.85">Most observations arrived after midnight. The model notes this without comment.</text>
    <text x="46" y="216" fill="#7FA6D4" font-size="9.4" font-family="Consolas, 'JetBrains Mono', monospace" letter-spacing="2.4" opacity="0.5">STATE VECTOR</text>
    <rect x="46" y="224" width="74" height="20" rx="5" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-width="0.7" stroke-opacity="0.4"/><text x="83" y="238" text-anchor="middle" fill="#A78BFA" font-size="10" font-family="Consolas, 'JetBrains Mono', monospace">22 pushes</text>
    <rect x="129" y="224" width="86" height="20" rx="5" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-width="0.7" stroke-opacity="0.4"/><text x="172" y="238" text-anchor="middle" fill="#A78BFA" font-size="10" font-family="Consolas, 'JetBrains Mono', monospace">world-model</text>
    <rect x="224" y="224" width="50" height="20" rx="5" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-width="0.7" stroke-opacity="0.4"/><text x="249" y="238" text-anchor="middle" fill="#A78BFA" font-size="10" font-family="Consolas, 'JetBrains Mono', monospace">graph</text>
    <rect x="283" y="224" width="62" height="20" rx="5" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-width="0.7" stroke-opacity="0.4"/><text x="314" y="238" text-anchor="middle" fill="#A78BFA" font-size="10" font-family="Consolas, 'JetBrains Mono', monospace">silicon</text>
    <rect x="354" y="224" width="116" height="20" rx="5" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-width="0.7" stroke-opacity="0.4"/><text x="412" y="238" text-anchor="middle" fill="#A78BFA" font-size="10" font-family="Consolas, 'JetBrains Mono', monospace">median 15.5h IST</text>
    <circle cx="1344" cy="232" r="4" fill="#A78BFA"><animate attributeName="opacity" values="1;0.15;1" dur="4s" repeatCount="indefinite"/></circle>
    <rect x="1" y="1" width="1398" height="282" rx="15.5" fill="none"
          stroke="#1B3566" stroke-width="1" opacity="0.7"/>
  </g>
</svg>
