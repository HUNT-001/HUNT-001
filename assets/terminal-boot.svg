<svg width="1400" height="200" viewBox="0 0 1400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#030811"/>
      <stop offset="50%"  stop-color="#071226"/>
      <stop offset="100%" stop-color="#0C1D3E"/>
    </linearGradient>
    <filter id="cornerGlow" x="-60%" y="-60%" width="280%" height="280%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#60A5FA" flood-opacity="0.5"/>
    </filter>
    <clipPath id="clip"><rect width="1400" height="200" rx="16"/></clipPath>
  </defs>

  <rect width="1400" height="200" rx="16" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="1400" height="34" fill="#040C1C" opacity="0.7"/>
    <circle cx="26" cy="17" r="5" fill="#EF4444" opacity="0.7"/>
    <circle cx="46" cy="17" r="5" fill="#F59E0B" opacity="0.7"/>
    <circle cx="66" cy="17" r="5" fill="#22C55E" opacity="0.7"/>
    <text x="700" y="21" text-anchor="middle" fill="#5FA8CC" font-size="11" font-family="Consolas, monospace" letter-spacing="2" opacity="0.7">tanush@edge-ai:~$</text>
    <line x1="0" y1="34" x2="1400" y2="34" stroke="#162F5C" stroke-width="1" opacity="0.7"/>

    
    <text x="40" y="46" fill="#5EEAD4" font-size="14" font-family="Consolas, monospace">
      &gt; booting tanush.sys ...
    </text>
    <text x="40" y="72" fill="#5EEAD4" font-size="14" font-family="Consolas, monospace">
      &gt; loading modules: RTL · VERIFICATION · ML · EDGE-AI ......... [OK]
    </text>
    <text x="40" y="98" fill="#5EEAD4" font-size="14" font-family="Consolas, monospace">
      &gt; mounting toolchain: systemverilog · pytorch · vivado ....... [OK]
    </text>
    <text x="40" y="124" fill="#5EEAD4" font-size="14" font-family="Consolas, monospace">
      &gt; linking accelerator profile: binary / quantized inference .. [OK]
    </text>
    <text x="40" y="150" fill="#7DD3FC" font-size="14" font-family="Consolas, monospace">
      &gt; status: online
    </text>

    <rect x="40" y="162" width="9" height="15" fill="#7DD3FC">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>


    <g filter="url(#cornerGlow)" opacity="0.8">
      <path d="M22 20 L22 40 M22 20 L42 20" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g filter="url(#cornerGlow)" opacity="0.8">
      <path d="M1378 180 L1378 160 M1378 180 L1358 180" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <rect x="1" y="1" width="1398" height="198" rx="15.5" fill="none" stroke="#162F5C" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
