<text x="70" y="52" fill="#C084FC" font-size="11" font-family="Consolas, 'JetBrains Mono', monospace" letter-spacing="4.5" opacity="0.9">VARIATIONAL QUANTUM EIGENSOLVER &#8212; THE BOUND THAT MAKES IT WORK</text>
<text x="70" y="116" fill="#F2ECFF" font-size="30" font-family="'Cambria Math', 'Latin Modern Math', Georgia, serif" font-style="italic" filter="url(#softv)">E<tspan font-size="18" dy="6">0</tspan><tspan dy="-6"> &#8804; E(&#952;) = &#10216;&#968;(&#952;)| H&#770; |&#968;(&#952;)&#10217;&#160;&#160;&#160; |&#968;(&#952;)&#10217; = U(&#952;) |0&#10217;</tspan><tspan font-size="18" dy="-10">&#8855;n</tspan></text>
<text x="70" y="160" fill="#D6C7F5" font-size="20" font-family="'Cambria Math', 'Latin Modern Math', Georgia, serif" font-style="italic" opacity="0.92">H&#770; = &#8721;<tspan font-size="13" dy="5">&#945;</tspan><tspan dy="-5"> c</tspan><tspan font-size="13" dy="5">&#945;</tspan><tspan dy="-5"> P</tspan><tspan font-size="13" dy="5">&#945;</tspan><tspan dy="-5">,&#160; P</tspan><tspan font-size="13" dy="5">&#945;</tspan><tspan dy="-5"> &#8712; { I, X, Y, Z }<tspan font-size="13" dy="5">&#8855;n</tspan></tspan></text>
<text x="70" y="198" fill="#7FA6D4" font-size="11.5" font-family="Consolas, 'JetBrains Mono', monospace" opacity="0.8">the variational principle guarantees you can never undershoot the ground state &#8212; so optimisation is safe, and only ever unfinished.</text>
<circle cx="1180" cy="112" r="62" fill="none" stroke="#A78BFA" stroke-width="1.1" opacity="0.5"/>
