<line x1="1108" y1="112" x2="1252" y2="112" stroke="#A78BFA" stroke-width="0.7" opacity="0.3"/>
<g><line x1="1180" y1="112" x2="1224" y2="70" stroke="#F5F3FF" stroke-width="2" filter="url(#softv)"/><circle cx="1224" cy="70" r="4.5" fill="#F5F3FF"/><animateTransform attributeName="transform" type="rotate" from="0 1180 112" to="360 1180 112" dur="12s" repeatCount="indefinite"/></g>
